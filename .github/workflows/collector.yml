name: Yekis Telegram Collector

on:
  schedule:
    # Run once every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab anytime!

jobs:
  collect:
    name: Scrape & Extract Opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Restore Telegram User Session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          mkdir -p var
          echo "$TELEGRAM_SESSION_B64" | base64 --decode > var/telegram_user.session

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head

      - name: Seed Production Sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.seed_sources

      - name: Execute Telegram Collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_ENABLED: "true"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION_PATH: "var/telegram_user"
          TELEGRAM_FETCH_LIMIT: "15"
          ADMIN_ALERT_CHAT_ID: ${{ secrets.ADMIN_ALERT_CHAT_ID }}
          EXTRACTION_PROVIDER: ${{ secrets.EXTRACTION_PROVIDER }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PUBLISHING_ENABLED: "true"
          PUBLISHING_ALLOWED_CHANNELS: "@yekis_channel"
        run: |
          python -m scripts.run_collection
