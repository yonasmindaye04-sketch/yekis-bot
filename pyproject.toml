[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yekis-intelligence"
version = "0.3.0"
description = "Opportunity discovery and content intelligence service for Yekis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "telethon>=1.36,<2.0",
  "cryptg>=0.4,<1.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<7.0",
  "packaging>=23.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Makes `scripts/` importable from tests for both `pytest` and `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC"]
# FastAPI's `db: Session = Depends(get_db)` idiom is intentional.
ignore = ["B008"]
